# SulphurCK — ultra-light HTTP checker (CLI/TUI/daemon)
# Language: Rust + tokio (chosen over Go for footprint on 1GB RAM VM)

[package]
name = "sulphur-ck"
version = "0.1.1"
edition = "2021"
description = "Multiplatform HTTP request-based checker: configs, proxies, LoliScript engine"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "sulphurck"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal", "fs"] }
futures = "0.3"

# HTTP client (reqwest with rustls — no OpenSSL)
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "cookies",
  "gzip",
  "brotli",
  "deflate",
  "json",
  "multipart",
  "stream",
] }

# SOCKS / HTTP proxy support for reqwest
tokio-socks = "0.5"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# config / serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# parsing
regex = "1"
once_cell = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# utils
anyhow = "1"
thiserror = "2"
dirs = "6"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }

# IPC for daemon/TUI split
interprocess = { version = "2", features = ["tokio"] }
bincode = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
